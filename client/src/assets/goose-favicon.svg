<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"></stop>
      <stop offset="1" stop-color="#58cc02"></stop>
    </linearGradient>
  </defs>
  <!-- background circle using your gradient -->
  <circle cx="40" cy="40" r="38" fill="url(#g)"></circle>
  <!-- goose body/head simplified -->
  <ellipse cx="40" cy="48" rx="18" ry="12" fill="#fff" stroke="#e6e9ef" stroke-width="2"></ellipse>
  <rect x="37" y="34" width="6" height="14" rx="3" fill="#fff" stroke="#e6e9ef" stroke-width="2"></rect>
  <circle cx="40" cy="29" r="7.5" fill="#fff" stroke="#e6e9ef" stroke-width="2"></circle>
  <!-- eye -->
  <circle cx="43.2" cy="27.8" r="1.7" fill="#0f172a"></circle>
  <!-- beak -->
  <polygon points="47,29 60,25 47,22" fill="#f59e0b"></polygon>
</svg>
