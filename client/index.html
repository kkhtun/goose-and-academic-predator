<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOOSE & ACADEMIC PREDATOR - Educational Board Game</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .game-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Character Selection */
        .character-selection {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .character-card {
            background: linear-gradient(145deg, #f0f0f0, #ffffff);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .character-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-color: #58cc02;
        }

        .character-card.selected {
            border-color: #58cc02;
            background: linear-gradient(145deg, #e8f5e9, #ffffff);
        }

        .character-emoji {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .discipline-select {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            font-size: 16px;
            width: 100%;
            background: white;
        }

        /* Game Board */
        .game-board {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: linear-gradient(145deg, #f5f5f5, #ffffff);
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stats {
            display: flex;
            gap: 20px;
        }

        .stat-item {
            background: linear-gradient(145deg, #58cc02, #89e219);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(145deg, #f8f9fa, #ffffff);
            border-radius: 15px;
        }

        .board-square {
            aspect-ratio: 1;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            padding: 5px;
            text-align: center;
        }

        .board-square:hover {
            transform: scale(1.1);
            z-index: 10;
        }

        .square-reward {
            background: linear-gradient(145deg, #ffd93d, #ffed4e);
            border: 2px solid #ffc107;
        }

        .square-event {
            background: linear-gradient(145deg, #ff6b6b, #ff8787);
            border: 2px solid #ef5350;
            color: white;
        }

        .square-quiz {
            background: linear-gradient(145deg, #4ecdc4, #44a3aa);
            border: 2px solid #26a69a;
            color: white;
        }

        .square-build {
            background: linear-gradient(145deg, #95e1d3, #81c9bb);
            border: 2px solid #4db6ac;
        }

        .square-choice {
            background: linear-gradient(145deg, #a29bfe, #8b82ff);
            border: 2px solid #7c3aed;
            color: white;
        }

        .square-current {
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 20px rgba(88, 204, 2, 0.6);
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        .player-marker {
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 24px;
            z-index: 5;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        /* Controls */
        .game-controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(145deg, #58cc02, #89e219);
            color: white;
            box-shadow: 0 5px 20px rgba(88, 204, 2, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(88, 204, 2, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(145deg, #6c757d, #495057);
            color: white;
        }

        .dice-result {
            font-size: 48px;
            margin: 20px;
            animation: rollDice 0.5s ease;
        }

        @keyframes rollDice {
            0% {
                transform: rotate(0deg) scale(0.5);
            }
            50% {
                transform: rotate(180deg) scale(1.2);
            }
            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        /* Events and Quizzes */
        .event-modal, .quiz-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .modal-icon {
            font-size: 48px;
        }

        .modal-title {
            font-size: 24px;
            color: #333;
            font-weight: bold;
        }

        .modal-body {
            margin: 20px 0;
            line-height: 1.6;
            color: #555;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
        }

        .choice-btn {
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-size: 16px;
        }

        .choice-btn:hover {
            background: linear-gradient(145deg, #f0f0f0, #ffffff);
            border-color: #58cc02;
            transform: translateX(5px);
        }

        .choice-btn.correct {
            background: linear-gradient(145deg, #c8e6c9, #a5d6a7);
            border-color: #4caf50;
        }

        .choice-btn.incorrect {
            background: linear-gradient(145deg, #ffcdd2, #ef9a9a);
            border-color: #f44336;
        }

        /* Mentor */
        .mentor-box {
            background: linear-gradient(145deg, #e3f2fd, #bbdefb);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border-left: 5px solid #2196f3;
        }

        .mentor-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .mentor-avatar {
            font-size: 32px;
        }

        .mentor-name {
            font-weight: bold;
            color: #1976d2;
        }

        .mentor-message {
            color: #555;
            font-style: italic;
            line-height: 1.5;
        }

        /* Progress Bar */
        .progress-container {
            margin: 30px 0;
        }

        .progress-bar {
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #58cc02, #89e219);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        /* Win Screen */
        .win-screen {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        .trophy {
            font-size: 100px;
            margin: 20px 0;
            animation: celebrateBounce 1s ease infinite;
        }

        @keyframes celebrateBounce {
            0%, 100% {
                transform: scale(1) rotate(0deg);
            }
            25% {
                transform: scale(1.1) rotate(-5deg);
            }
            75% {
                transform: scale(1.1) rotate(5deg);
            }
        }

        .final-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .stat-card {
            background: linear-gradient(145deg, #f5f5f5, #ffffff);
            padding: 20px;
            border-radius: 15px;
            min-width: 150px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #58cc02;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .board-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 5px;
            }

            .board-square {
                font-size: 10px;
            }

            .player-marker {
                font-size: 18px;
            }

            .modal-content {
                padding: 20px;
            }

            .btn {
                padding: 12px 25px;
                font-size: 16px;
            }
        }

        /* Loading Animation */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #58cc02;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    <script type="text/babel">
  const { useState, useEffect } = React;

  /* =============== HELPERS =============== */

  const ANIMALS = [

    { id: 'dog', emoji: '🐕', name: 'Dog', skill: 'Empathetic - Great collaborator' },

  ];

  const QUIZ_DATABASE = {
    peerReview: {
      question: "Which of these is a RED FLAG in peer review timelines?",
      options: ["Review completed in 24 hours","Review takes 4-6 weeks","Detailed feedback provided","Multiple reviewers involved"],

    dataManipulation: {

    ethicalPublishing: {

  const EVENT_SCENARIOS = {
    parrotThief: {
      title: "The Paper Thief Parrot! 🦜",

      choices: [

  const generateBoardSquares = () => {
    const squares = [];
    const types = ['reward','event','quiz','build','choice'];
    for (let i=0;i<90;i++) {
      squares.push({ id:i, type:types[Math.floor(Math.random()*types.length)], label:String(i+1), visited:false });

    squares[0]={id:0,type:'start',label:'START',visited:false};
    squares[2]={id:2,type:'quiz',label:'3: Quiz',visited:false};

    squares[65]={id:65,type:'quiz',label:'66: Media',visited:false};

    const map = {
      reward:'square-reward', event:'square-event', quiz:'square-quiz', build:'square-build',
      choice:'square-choice', start:'square-start', finish:'square-finish'
    };
    return `${base} ${map[sq.type]||''}`;
  };

        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:16}}>

  }

  function MentorBox({ message }) {

        <div className="mentor-message">{message}</div>
      </div>

      <div className="board-header">
        <div className="player-info">
          <div style={{ fontSize: 28 }}>{animal?.emoji || '🪿'}</div>
          <div>
            <div style={{ fontWeight: 'bold' }}>

            </div>
            <div style={{ fontSize: 12, color: '#555' }}>
              Turn #{turn} • Position {pos + 1} / 90
            </div>
          </div>
        </div>
        <div className="stats">
          <div className="stat-item">⭐ {reputation}</div>
          <div className="stat-item">📚 {knowledge}</div>
          <div className="stat-item">🪙 {coins}</div>
        </div>
      </div>
    );
  }

  function Progress({ percent }) {
    return (
      <div className="progress-container">
        <div className="progress-bar">
          <div className="progress-fill" style={{ width: `${percent}%` }}>{percent}%</div>
        </div>
      </div>
    );
  }

  /* =============== PAGES =============== */
  function HomePage({ onChooseSector, onInstructions }) {
    return (
      <div className="character-selection">
        <h2 className="modal-title">Goose and Predator</h2>
        <p style={{color:'#555', marginTop:6}}>Let’s Begin</p>
        <div style={{display:'flex', gap:12, marginTop:14}}>
          <button className="btn btn-primary" onClick={onChooseSector}>Choose a Sector</button>
          <button className="btn btn-secondary" onClick={onInstructions}>Gaming Instructions</button>
        </div>
      </div>
    );
  }

  function InstructionsPage({ onBack }) {
    return (
      <div className="character-selection">
        <h2 className="modal-title">Gaming Instructions</h2>
        <ul style={{marginTop:10, paddingLeft:18, lineHeight:1.7, color:'#555'}}>
          <li>Roll <b>two dice</b> to move across the 90-square board.</li>
          <li>Face quizzes, moral choices, and scenarios at each stop.</li>
          <li>Earn reputation, knowledge, collaborators, and coins.</li>
          <li>Complete Level 0 → Level 1 → Level 2 to graduate.</li>
        </ul>
        <div style={{marginTop:14, textAlign:'right'}}>
          <button className="btn btn-secondary" onClick={onBack}>Back</button>
        </div>
      </div>
    );
  }

  function SectorPage({
    selectedAnimal, setSelectedAnimal,
    selectedDiscipline, setSelectedDiscipline,
    onStartLevel0, onBack
  }) {
    return (
      <div className="character-selection">
        <h2 className="modal-title">Please select…</h2>
        <div className="character-grid" style={{marginTop:10}}>
          {ANIMALS.map(an => (
            <div key={an.id}
              className={`character-card ${selectedAnimal?.id === an.id ? 'selected' : ''}`}
              onClick={() => setSelectedAnimal(an)}
            >
              <div className="character-emoji">{an.emoji}</div>
              <div style={{ fontWeight: 'bold', marginBottom: 6 }}>{an.name}</div>
              <div style={{ fontSize: 12, color: '#666' }}>{an.skill}</div>
            </div>
          ))}
        </div>

        <select
          className="discipline-select"
          value={selectedDiscipline}
          onChange={(e) => setSelectedDiscipline(e.target.value)}
        >
          <option value="">Select a discipline…</option>
          {DISCIPLINES.map(d => <option key={d} value={d}>{d}</option>)}
        </select>

        <div style={{ display:'flex', gap:10, justifyContent:'flex-end', marginTop:10 }}>
          <button className="btn btn-secondary" onClick={onBack}>Back</button>
          <button
            className="btn btn-primary"
            disabled={!selectedAnimal || !selectedDiscipline}
            onClick={onStartLevel0}
          >
            Start Level 0
          </button>
        </div>
      </div>
    );
  }

  function CongratsPage({ level, onNext, onGraduate }) {
    return (
      <div className="character-selection">
        <h2 className="modal-title">Congratulations!!</h2>
        <p style={{color:'#555', marginTop:6}}>You Completed Level {level}</p>
        <div style={{marginTop:14}}>
          {level < 2 ? (
            <button className="btn btn-primary" onClick={onNext}>
              Continue to Level {level + 1}
            </button>
          ) : (
            <button className="btn btn-primary" onClick={onGraduate}>Graduate</button>
          )}
        </div>
      </div>
    );
  }

  function LevelPage({
    level, animal, discipline,
    game, actions
  }) {
    const {
      playerPosition, turnCount, reputation, knowledge, coins, diceResult,
      boardSquares, mentorMessage, skipNextTurn, isRolling
    } = game;

    const { rollDice, resetLevel, closeEvent, closeQuiz, handleQuizAnswer, handleEventChoice } = actions;
    const progressPercent = Math.round((playerPosition / 89) * 100);

    return (
      <div className="game-board">
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8}}>
          <h2 className="modal-title">LEVEL {level}</h2>
          <div style={{opacity:.8, fontWeight:'600'}}>Let’s Begin</div>
        </div>

        <HUD
          animal={animal}
          discipline={discipline}
          turn={turnCount}
          pos={playerPosition}
          reputation={reputation}
          knowledge={knowledge}
          coins={coins}
        />

        <MentorBox message={mentorMessage} />
        <Progress percent={progressPercent} />

        <div className="board-grid">
          {boardSquares.map(sq => {
            const classes = squareClassName(sq) + (playerPosition === sq.id ? ' square-current' : '');
            const faded = sq.visited && sq.id !== playerPosition ? { opacity: 0.85 } : null;
            return (
              <div key={sq.id} className={classes} style={faded} title={sq.type}>
                {playerPosition === sq.id && (
                  <div className="player-marker">{animal?.emoji || '🪿'}</div>
                )}
                <div style={{ fontSize: 14, marginBottom: 6 }}>{sq.label}</div>
                <div style={{ fontSize: 18 }}>
                  {sq.type === 'reward' ? '🎁' :
                   sq.type === 'event'  ? '📣' :
                   sq.type === 'quiz'   ? '❓' :
                   sq.type === 'build'  ? '🏗️' :
                   sq.type === 'choice' ? '⚖️' :
                   sq.type === 'start'  ? '🚩' :
                   sq.type === 'finish' ? '🏁' : '⬜'}
                </div>
              </div>
            );
          })}
        </div>

        <div className="game-controls">
          <button className="btn btn-primary" onClick={rollDice} disabled={isRolling}>
            {skipNextTurn ? 'Skip Turn' : 'Roll 2 Dice'}
          </button>
          <button className="btn btn-secondary" onClick={resetLevel}>Reset Level</button>
        </div>

        {diceResult && (
          <div className="center">
            <div className="dice-result">
              {dieFace(diceResult.d1)} + {dieFace(diceResult.d2)} = {diceResult.total}
            </div>
          </div>
        )}

        {/* Event modal */}
        {game.currentEvent && (
          <div className="event-modal">
            <div className="modal-content">
              <div className="modal-header">
                <div className="modal-icon">📣</div>
                <div className="modal-title">{game.currentEvent.title}</div>
              </div>
              <div className="modal-body">{game.currentEvent.description}</div>
              <div className="choices">
                {game.currentEvent.choices.map((c, i) => (
                  <button key={i} className="choice-btn" onClick={() => handleEventChoice(c)}>
                    {c.text}
                  </button>
                ))}
              </div>
              <div className="center" style={{ marginTop: 10 }}>
                <button className="btn btn-secondary" onClick={closeEvent}>Close</button>
              </div>
            </div>
          </div>
        )}

        {/* Quiz modal */}
        {game.currentQuiz && (
          <div className="quiz-modal">
            <div className="modal-content">
              <div className="modal-header">
                <div className="modal-icon">❓</div>
                <div className="modal-title">Quick Quiz</div>
              </div>
              <div className="modal-body">
                <div style={{ fontWeight: 'bold', marginBottom: 10 }}>
                  {game.currentQuiz.question}
                </div>
                <div className="choices">
                  {game.currentQuiz.options.map((opt, idx) => (
                    <button key={idx} className="choice-btn" onClick={() => handleQuizAnswer(idx)}>
                      {opt}
                    </button>
                  ))}
                </div>
                <div className="center" style={{ marginTop: 10 }}>
                  <button className="btn btn-secondary" onClick={closeQuiz}>Close</button>
                </div>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  /* =============== APP (FLOW + THEME) =============== */
  function App(){
    // flow: 'home' | 'instructions' | 'sector' | 'level' | 'congrats' | 'graduated'
    const [screen, setScreen] = useState('home');
    const [animal, setAnimal] = useState(null);
    const [discipline, setDiscipline] = useState('');
    const [level, setLevel] = useState(0);   // 0 breezy, 1 scary, 2 haunted

    // shared game state (carry over across levels)
    const [playerPosition, setPlayerPosition] = useState(0);
    const [reputation, setReputation] = useState(50);
    const [knowledge, setKnowledge] = useState(0);
    const [coins, setCoins] = useState(100);
    const [turnCount, setTurnCount] = useState(0);
    const [skipNextTurn, setSkipNextTurn] = useState(false);
    const [isRolling, setIsRolling] = useState(false);
    const [diceResult, setDiceResult] = useState(null);
    const [boardSquares, setBoardSquares] = useState(generateBoardSquares());
    const [mentorMessage, setMentorMessage] = useState("Welcome to the Publishing House! I'm Prof. BiblioChameleon, your guide. 🦎");
    const [currentEvent, setCurrentEvent] = useState(null);
    const [currentQuiz, setCurrentQuiz] = useState(null);

    // THEME switch on body attribute
    useEffect(() => {
      if (screen === 'level') {
        const theme = level === 0 ? 'breezy' : level === 1 ? 'scary' : 'haunted';
        document.body.setAttribute('data-theme', theme);
      } else {
        document.body.setAttribute('data-theme', 'breezy'); // default outside levels
      }
      return () => { /* keep theme as is on unmount */ };
    }, [screen, level]);

    const startLevel = (n) => {
      setLevel(n);
      setPlayerPosition(0); setTurnCount(0); setSkipNextTurn(false);
      setIsRolling(false); setDiceResult(null);
      setBoardSquares(generateBoardSquares());
      setMentorMessage(
        n===0 ? "Level 0: warm up and learn the basics." :
        n===1 ? "Level 1: watch the money — check editorial boards & indexing." :
                "Level 2: integrity first — protect public trust."
      );
      setCurrentEvent(null); setCurrentQuiz(null);
      setScreen('level');
    };

    const goCongrats = () => setScreen('congrats');
    const goGraduate = () => setScreen('graduated');

    const restartAll = () => {
      setAnimal(null); setDiscipline('');
      setLevel(0);
      setPlayerPosition(0);
      setReputation(50); setKnowledge(0); setCoins(100);
      setTurnCount(0); setSkipNextTurn(false);
      setIsRolling(false); setDiceResult(null);
      setBoardSquares(generateBoardSquares());
      setMentorMessage("Welcome to the Publishing House! I'm Prof. BiblioChameleon, your guide. 🦎");
      setCurrentEvent(null); setCurrentQuiz(null);
      setScreen('home');
    };

    // ————— In-level logic (now TWO dice)
    const rollDice = () => {
      if (isRolling) return;

      if (skipNextTurn) {
        setSkipNextTurn(false);
        setMentorMessage("You lost this turn. Be prepared next time!");
        setTurnCount(t => t + 1);
        return;
      }

      setIsRolling(true);
      const d1 = Math.floor(Math.random() * 6) + 1;
      const d2 = Math.floor(Math.random() * 6) + 1;
      const total = d1 + d2;
      setDiceResult({ d1, d2, total });

      setTimeout(() => {
        movePlayer(total);
        setIsRolling(false);
      }, 500);
    };

    const movePlayer = (steps) => {
      const newPos = Math.min(playerPosition + steps, 89);
      setPlayerPosition(newPos);
      setTurnCount(t => t + 1);

      setBoardSquares(prev => {
        const next = [...prev];
        if (next[newPos]) next[newPos].visited = true;
        return next;
      });

      handleSquareEvent(newPos);
    };

    const handleSquareEvent = (pos) => {
      const sq = boardSquares[pos];
      if (!sq) return;

      switch (sq.type) {
        case 'quiz':  triggerQuiz(); break;
        case 'event': triggerEvent(); break;
        case 'reward': handleReward(); break;
        case 'build':  handleBuild(); break;
        case 'choice': triggerMoralChoice(); break;
        case 'finish': goCongrats(); break;
        default:
          setMentorMessage("Keep going! Every step teaches you something new about academic publishing.");
      }

      if (pos === 2)  setMentorMessage("Macro-Area 1: Think-Check-Submit. Build reliable literature reviews and expect real peer review.");
      if (pos === 27) setMentorMessage("Macro-Area 2: Watch the money. Verify editorial boards and indexing before paying APCs.");
      if (pos === 58) setMentorMessage("Macro-Area 3: Integrity first. Protect public trust by avoiding misleading venues.");
    };

    const triggerQuiz = () => {
      const keys = Object.keys(QUIZ_DATABASE);
      setCurrentQuiz(QUIZ_DATABASE[keys[Math.floor(Math.random() * keys.length)]]);
    };

    const triggerEvent = () => {
      const keys = Object.keys(EVENT_SCENARIOS);
      setCurrentEvent(EVENT_SCENARIOS[keys[Math.floor(Math.random() * keys.length)]]);
    };

    const handleReward = () => {
      // tiny difficulty tweak by level: rewards slightly lower as level rises
      const base = Math.floor(Math.random() * 30) + 10;
      const penalty = level * 4; // 0, 4, 8
      const rewardCoins = Math.max(5, base - penalty);
      const rewardRep = Math.max(1, Math.floor(Math.random()*5)+1 - level);
      setCoins(c => c + rewardCoins);
      setReputation(r => Math.min(100, r + rewardRep));
      setMentorMessage(`Great! You found a reward! +${rewardCoins} coins and +${rewardRep} reputation!`);
    };

    const handleBuild = () => {
      const cost = 20 + level * 10;   // pricier at higher levels
      if (coins >= cost) {
        setCoins(c => c - cost);
        setKnowledge(k => k + 10 + level * 5);
        setMentorMessage(`Build successful! (-${cost} coins, +${10 + level*5} knowledge)`);
      } else {
        setMentorMessage(`You need at least ${cost} coins to build at this level.`);
      }
    };

    const triggerMoralChoice = () => {
      // penalties harsher at higher levels
      setCurrentEvent({
        title: "Ethical Dilemma! ⚖️",
        description: "A questionable journal offers immediate publication with high impact factor claims.",
        choices: [
          { text: "Accept for career advancement", effect: { reputation: -15 - level*5, coins: 50 } },
          { text: "Investigate thoroughly first", effect: { reputation: 10, knowledge: 10 + level*5 } },
          { text: "Report to authorities", effect: { reputation: 15, knowledge: 5 + level*5 } }
        ]
      });
    };

    const handleQuizAnswer = (answerIndex) => {
      const isCorrect = answerIndex === currentQuiz.correct;
      if (isCorrect) {
        setKnowledge(k => k + 10 + level * 2);
        setReputation(r => Math.min(100, r + 5));
        setMentorMessage(`Correct! ${currentQuiz.explanation} (+${10 + level*2} knowledge, +5 reputation)`);
      } else {
        setKnowledge(k => Math.max(0, k - (5 + level * 2)));
        setMentorMessage(`Not quite. ${currentQuiz.explanation} (-${5 + level*2} knowledge)`);
      }
      setTimeout(() => setCurrentQuiz(null), 1400);
    };

    const handleEventChoice = (choice) => {
      const eff = choice.effect || {};
      if (typeof eff.reputation === 'number') setReputation(r => Math.max(0, Math.min(100, r + eff.reputation)));
      if (typeof eff.knowledge  === 'number') setKnowledge(k => Math.max(0, k + eff.knowledge));
      if (typeof eff.coins      === 'number') setCoins(c => Math.max(0, c + eff.coins));
      if (typeof eff.skip       === 'number' && eff.skip > 0) setSkipNextTurn(true);

      const effectText = Object.entries(eff).map(([k,v]) => `${v>0?'+':''}${v} ${k}`).join(', ');
      setMentorMessage(`Choice made! Effects: ${effectText || '—'}`);
      setCurrentEvent(null);
    };

    const closeEvent = () => setCurrentEvent(null);
    const closeQuiz  = () => setCurrentQuiz(null);

    const resetLevel = () => {
      setPlayerPosition(0);
      setTurnCount(0);
      setSkipNextTurn(false);
      setIsRolling(false);
      setDiceResult(null);
      setBoardSquares(generateBoardSquares());
      setCurrentEvent(null);
      setCurrentQuiz(null);
      setMentorMessage(
        level===0 ? "Level 0: warm up and learn the basics." :
        level===1 ? "Level 1: watch the money — check editorial boards & indexing." :
                    "Level 2: integrity first — protect public trust."
      );
    };

    const totalScore = reputation * 10 + knowledge * 5 + coins;
    const badge = totalScore >= 2000 ? { badge:'🏆', level:'Gold',   color:'#FFD700' } :
                  totalScore >= 1500 ? { badge:'🥈', level:'Silver', color:'#C0C0C0' } :
                                        { badge:'🥉', level:'Bronze', color:'#CD7F32' };

    // Render by screen
    return (
      <div className="game-container">
        <Header onExit={restartAll} />

        {screen === 'home' && (
          <HomePage
            onChooseSector={() => setScreen('sector')}
            onInstructions={() => setScreen('instructions')}
          />
        )}

        {screen === 'instructions' && (
          <InstructionsPage onBack={() => setScreen('home')} />
        )}

        {screen === 'sector' && (
          <SectorPage
            selectedAnimal={animal}
            setSelectedAnimal={setAnimal}
            selectedDiscipline={discipline}
            setSelectedDiscipline={setDiscipline}
            onStartLevel0={() => startLevel(0)}
            onBack={() => setScreen('home')}
          />
        )}

        {screen === 'level' && (
          <LevelPage
            level={level}
            animal={animal}
            discipline={discipline}
            game={{
              playerPosition, turnCount, reputation, knowledge, coins, diceResult,
              boardSquares, mentorMessage, skipNextTurn, isRolling,
              currentEvent, currentQuiz
            }}
            actions={{
              rollDice, resetLevel, closeEvent, closeQuiz,
              handleQuizAnswer, handleEventChoice
            }}
          />
        )}

        {screen === 'congrats' && (
          <CongratsPage
            level={level}
            onNext={() => startLevel(level + 1)}
            onGraduate={goGraduate}
          />
        )}

        {screen === 'graduated' && (
          <div className="win-screen">
            <h2 className="modal-title">You Finished the Board!</h2>
            <div className="trophy">{badge.badge}</div>
            <div className="final-stats">
              <div className="stat-card"><div className="stat-value" style={{color:badge.color}}>{badge.level}</div><div className="stat-label">Badge</div></div>
              <div className="stat-card"><div className="stat-value">{totalScore}</div><div className="stat-label">Total Score</div></div>
              <div className="stat-card"><div className="stat-value">{reputation}</div><div className="stat-label">Reputation</div></div>
              <div className="stat-card"><div className="stat-value">{knowledge}</div><div className="stat-label">Knowledge</div></div>
              <div className="stat-card"><div className="stat-value">{coins}</div><div className="stat-label">Coins</div></div>
            </div>
            <button className="btn btn-primary" onClick={restartAll}>Play Again</button>
          </div>
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
