openapi: 3.0.3
info:
  title: Goose Academic Predator API
  version: 1.0.0
  description: REST API for the board game (no auth, public).

paths:
  /meta/disciplines:
    get:
      summary: List available disciplines
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: string

  /meta/animals:
    get:
      summary: List selectable avatars
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalList'

  /games:
    post:
      summary: Start a new game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [discipline, animal, level]
              properties:
                discipline: { type: string }
                animal:
                  type: object
                  properties:
                    code: { type: string, example: goose }
                level: { type: integer, enum: [0,1,2] }
      responses:
        '200':
          description: Game created
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    $ref: '#/components/schemas/GameState'
        '400':
          $ref: '#/components/responses/Error'

  /games/{gameId}:
    get:
      summary: Get current game state
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    $ref: '#/components/schemas/GameState'
        '404':
          $ref: '#/components/responses/Error'

  /games/{gameId}/board:
    get:
      summary: Get 30-square board for a level
      parameters:
        - $ref: '#/components/parameters/GameId'
        - in: query
          name: level
          required: true
          schema: { type: integer, enum: [0,1,2] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'

  /games/{gameId}/roll:
    post:
      summary: Roll dice, move, and resolve landing
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Result of roll and updated state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollResult'
        '409':
          $ref: '#/components/responses/Error'

  /games/{gameId}/quiz/{quizId}/answer:
    post:
      summary: Submit quiz answer
      parameters:
        - $ref: '#/components/parameters/GameId'
        - in: path
          name: quizId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answerIndex]
              properties:
                answerIndex: { type: integer }
      responses:
        '200':
          description: Answer result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAnswerResult'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /games/{gameId}/event/{eventId}/choice:
    post:
      summary: Apply a choice for the current event
      parameters:
        - $ref: '#/components/parameters/GameId'
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choiceKey]
              properties:
                choiceKey: { type: string, example: verify }
      responses:
        '200':
          description: Effects applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventChoiceResult'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /games/{gameId}/complete-level:
    post:
      summary: Complete the current level and compute route
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Completion summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelCompletion'

  /games/{gameId}/start-next-level:
    post:
      summary: Start next level / heaven / hell board
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                route:
                  type: string
                  enum: [next, heaven, hell]
      responses:
        '200':
          description: New level state and board
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { $ref: '#/components/schemas/GameState' }
                  board: { $ref: '#/components/schemas/Board' }

  /games/{gameId}/finish:
    post:
      summary: Finalize game (badge + leaderboard)
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                player:
                  type: object
                  properties:
                    name: { type: string }
      responses:
        '200':
          description: Finished summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishResult'

  /leaderboard:
    get:
      summary: Public leaderboard
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'

  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }

components:
  parameters:
    GameId:
      in: path
      name: gameId
      required: true
      schema: { type: string }

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    AnimalList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              emoji: { type: string }
              label: { type: string }

    GameState:
      type: object
      properties:
        gameId: { type: string }
        level: { type: integer, enum: [0,1,2] }
        discipline: { type: string }
        animal:
          type: object
          properties:
            code: { type: string }
            emoji: { type: string }
            label: { type: string }
        position: { type: integer }
        turn: { type: integer }
        reputation: { type: integer }
        knowledge: { type: integer }
        coins: { type: integer }
        skipNextTurn: { type: boolean }
        pending:
          type: object
          nullable: true
          properties:
            type: { type: string, enum: [quiz, event] }
            quiz:
              $ref: '#/components/schemas/Quiz'
            event:
              $ref: '#/components/schemas/Event'
        mentorMessage: { type: string }
        uiSignals:
          type: object
          additionalProperties: true

    Board:
      type: object
      properties:
        level: { type: integer }
        squares:
          type: array
          items:
            $ref: '#/components/schemas/Square'

    Square:
      type: object
      properties:
        index: { type: integer }
        type:
          type: string
          enum: [start, reward, event, quiz, build, choice, predator, pause, finish]
        label: { type: string }
        predator:
          type: object
          nullable: true
          properties:
            mode: { type: string, enum: [start, back] }
            steps: { type: integer }

    RollResult:
      type: object
      properties:
        result:
          type: object
          properties:
            dice:
              type: object
              properties:
                d1: { type: integer }
                d2: { type: integer }
                total: { type: integer }
            square: { $ref: '#/components/schemas/Square' }
            state: { $ref: '#/components/schemas/GameState' }

    Quiz:
      type: object
      properties:
        id: { type: string }
        question: { type: string }
        options:
          type: array
          items: { type: string }
        meta:
          type: object
          additionalProperties: true

    Event:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              key: { type: string, example: "verify" }
              text: { type: string }

    QuizAnswerResult:
      type: object
      properties:
        correct: { type: boolean }
        explanation: { type: string }
        deltas:
          type: object
          properties:
            reputation: { type: integer }
            knowledge: { type: integer }
            coins: { type: integer }
        mentorMessage: { type: string }
        state: { $ref: '#/components/schemas/GameState' }

    EventChoiceResult:
      type: object
      properties:
        effects:
          type: object
          properties:
            reputation: { type: integer }
            knowledge: { type: integer }
            coins: { type: integer }
        mentorMessage: { type: string }
        state: { $ref: '#/components/schemas/GameState' }

    LevelCompletion:
      type: object
      properties:
        level: { type: integer }
        score: { type: integer }
        route:
          type: string
          enum: [next, heaven, hell]
        elevator:
          type: object
          properties:
            from: { type: integer }
            to: { type: integer }
            theme: { type: string }
        state: { $ref: '#/components/schemas/GameState' }

    FinishResult:
      type: object
      properties:
        score: { type: integer }
        badge: { type: string, enum: [Bronze, Silver, Gold] }
        leaderboardRank: { type: integer }
        graduation:
          type: object
          properties:
            avatar:
              type: object
              properties:
                animal: { type: string }
                outfit: { type: string }
                discipline: { type: string }
            shareImageUrl: { type: string }
            certificateUrl: { type: string }
        state: { $ref: '#/components/schemas/GameState' }

    Leaderboard:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              player:
                type: object
                properties:
                  name: { type: string }
                  animal: { type: string }
                  discipline: { type: string }
              score: { type: integer }
              reputation: { type: integer }
              knowledge: { type: integer }
              coins: { type: integer }
              badge: { type: string }
              completedAt: { type: string, format: date-time }

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
